<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Toggle</title>
  <style>
    body {
      transition: 0.3s;
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }
    .dark { background: #222; color: #eee; }
  </style>
</head>
<body>
  <h1>Toggle Light/Dark Mode</h1>
  <button onclick="toggleMode()">Toggle</button>

  <script>
    function toggleMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
