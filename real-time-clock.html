
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Clock</title>
  <style>
    body { text-align: center; font-size: 2em; padding: 50px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.getElementById("clock").innerText = time;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
