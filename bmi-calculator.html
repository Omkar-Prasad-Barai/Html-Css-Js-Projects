<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator</title>
  <style>
    body { text-align: center; padding: 20px; font-family: sans-serif; }
    input { margin: 5px; padding: 10px; width: 150px; }
    button { padding: 10px 20px; }
  </style>
</head>
<body>
  <h2>BMI Calculator</h2>
  <input type="number" id="weight" placeholder="Weight (kg)">
  <input type="number" id="height" placeholder="Height (m)">
  <br><button onclick="calculateBMI()">Calculate</button>
  <p id="output"></p>

  <script>
    function calculateBMI() {
      const weight = parseFloat(document.getElementById("weight").value);
      const height = parseFloat(document.getElementById("height").value);
      if (!weight || !height) {
        alert("Please enter valid numbers.");
        return;
      }
      const bmi = (weight / (height * height)).toFixed(2);
      document.getElementById("output").innerText = `Your BMI is ${bmi}`;
    }
  </script>
</body>
</html>
