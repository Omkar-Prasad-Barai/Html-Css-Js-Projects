<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tip Calculator</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    input { padding: 8px; margin: 10px; }
  </style>
</head>
<body>
  <h2>Tip Calculator</h2>
  <input type="number" id="amount" placeholder="Bill Amount"><br>
  <input type="number" id="tip" placeholder="Tip %" /><br>
  <button onclick="calculate()">Calculate Tip</button>
  <p id="result"></p>

  <script>
    function calculate() {
      const amt = parseFloat(document.getElementById('amount').value);
      const tip = parseFloat(document.getElementById('tip').value);
      const total = amt * (tip / 100);
      document.getElementById('result').innerText = "Tip Amount: ₹" + total.toFixed(2);
    }
  </script>
</body>
</html>
