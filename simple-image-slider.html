<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Slider</title>
  <style>
    img { width: 300px; height: 200px; display: block; margin: 20px auto; }
    button { margin: 0 10px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h2>Simple Image Slider</h2>
  <img id="slider" src="https://picsum.photos/300/200?random=1">
  <button onclick="prev()">Prev</button>
  <button onclick="next()">Next</button>

  <script>
    let index = 1;
    function show() {
      document.getElementById('slider').src = `https://picsum.photos/300/200?random=${index}`;
    }
    function next() {
      index++;
      show();
    }
    function prev() {
      index--;
      if (index < 1) index = 1;
      show();
    }
  </script>
</body>
</html>
